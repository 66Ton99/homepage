    <style>
      :root {
        color-scheme: dark;
        --bg: #111111;
        --surface: #171717;
        --surface-2: #1d1d1d;
        --text: #eeeeea;
        --muted: #999993;
        --quiet: #6f6f69;
        --line: #30302d;
        --line-strong: #484844;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        letter-spacing: 0;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(180deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          var(--bg);
        background-size: 72px 72px;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        width: min(980px, calc(100% - 44px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 34px 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 28px;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        color: var(--muted);
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          "Liberation Mono",
          monospace;
        font-size: 13px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        color: var(--text);
        font-weight: 700;
      }

      .main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(300px, 360px);
        gap: 34px;
        align-items: center;
      }

      .visual {
        width: 100%;
        display: block;
        border: 1px solid var(--line);
        background: var(--surface);
        aspect-ratio: 900 / 620;
        object-fit: cover;
      }

      .links {
        border: 1px solid var(--line-strong);
        background: rgba(23, 23, 23, 0.86);
      }

      .links header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          "Liberation Mono",
          monospace;
        font-size: 12px;
        text-transform: uppercase;
      }

      .link-list {
        display: grid;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .profile-link {
        display: grid;
        grid-template-columns: 30px 1fr auto;
        gap: 14px;
        align-items: center;
        min-height: 70px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        color: var(--text);
        transition:
          background 150ms ease,
          color 150ms ease;
      }

      .profile-link:last-child {
        border-bottom: 0;
      }

      .profile-link:hover,
      .profile-link:focus-visible {
        background: var(--surface-2);
        outline: none;
      }

      .profile-link svg {
        width: 19px;
        height: 19px;
        color: var(--muted);
      }

      .profile-link strong {
        display: block;
        font-size: 17px;
        line-height: 1.1;
        font-weight: 650;
      }

      .profile-link span:last-child {
        color: var(--quiet);
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          "Liberation Mono",
          monospace;
        font-size: 12px;
      }

      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
        color: var(--quiet);
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          "Liberation Mono",
          monospace;
        font-size: 12px;
        text-transform: uppercase;
      }

      @media (max-width: 820px) {
        .page {
          width: min(100% - 28px, 640px);
        }

        .top,
        .foot {
          align-items: flex-start;
          flex-direction: column;
        }

        .main {
          grid-template-columns: 1fr;
          align-items: start;
        }

        .links {
          order: -1;
        }

        .visual {
          padding: 16px 0 28px;
        }
      }

      @media (max-width: 480px) {
        .page {
          width: min(100% - 22px, 420px);
          padding: 20px 0;
        }

        .profile-link {
          grid-template-columns: 28px 1fr;
        }

        .profile-link span:last-child {
          display: none;
        }
      }
    </style>
