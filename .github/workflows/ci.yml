name: CI

# Every commit on every branch, and every pull request. The site is static and
# deployed straight from site/, so the two things worth guarding are that the
# generators still run and that what is committed in site/ is what they produce.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # flake.nix pins PHP 8.5 and Node 22, so CI runs the same interpreter a
      # contributor gets from `nix develop`. The step below compares generator
      # output against what is committed, which is only meaningful if both
      # sides are on the same toolchain.
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build the pages
        run: nix develop --command bash -c 'php src/build.php && php src/build_home.php'

      - name: site/ matches the sources
        run: |
          if [ -n "$(git status --porcelain -- site)" ]; then
            echo "::error::site/ is out of date with src/. Run 'php src/build.php && php src/build_home.php' and commit the result."
            git status --porcelain -- site
            git diff -- site
            exit 1
          fi

      - name: Install test dependencies
        run: nix develop --command bash -c 'cd src && npm install --no-audit --no-fund'

      # test.js drives the built pages themselves — the same HTML that ships —
      # so it covers the server-rendered table, the calculator, the mode and
      # material selectors and the shareable URL in both languages.
      - name: Run tests
        run: nix develop --command bash -c 'cd src && npm test'
