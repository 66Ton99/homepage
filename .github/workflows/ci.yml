name: CI

# Every commit on every branch, and every pull request. The site is static and
# deployed straight from site/, so the two things worth guarding are that the
# generators still run and that what is committed in site/ is what they produce.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the pages
        run: |
          python3 src/build.py
          python3 src/build_home.py

      - name: site/ matches the sources
        run: |
          if [ -n "$(git status --porcelain -- site)" ]; then
            echo "::error::site/ is out of date with src/. Run 'python3 src/build.py && python3 src/build_home.py' and commit the result."
            git status --porcelain -- site
            git diff -- site
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm install --no-audit --no-fund
        working-directory: src

      # test.js drives the built pages themselves — the same HTML that ships —
      # so it covers the server-rendered table, the calculator, the mode and
      # material selectors and the shareable URL in both languages.
      - name: Run tests
        run: npm test
        working-directory: src
